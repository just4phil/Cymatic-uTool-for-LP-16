[package]
name = "lp16-tool"
version = "0.1.1"
edition = "2021"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.27", optional = true }
rfd = { version = "0.14", default-features = false, optional = true }

[profile.release]
lto = true
