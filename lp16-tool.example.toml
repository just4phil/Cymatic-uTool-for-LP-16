# lp16-tool settings. Copy this file to lp16-tool.toml and adjust the paths.
# lp16-tool.toml is looked for in the current folder, else next to the exe
# and in the folders above it. The GUI writes it when settings change.

# base folder: CymaticProjectLib\ = project library, AudioLibrary\ = audio files + import
library = "E:\LP16_LIBRARY"
# export target (chosen and remembered in the Export tab)
stick_root = "F:\"
# audio output of the rehearsal player (the Settings tab writes these)
# audio_host = "WASAPI"        # empty = default host
# audio_device = ""            # empty = default device
# audio_out_left = "1"         # output channels of the stereo mix (1-based)
# audio_out_right = "2"
# audio_buffer = "0"           # frames: 0 (driver default), 64, 128, 256, 512, 1024, 2048
# MIDI output port of the rehearsal player (Settings > MIDI output); empty = off
# midi_port = ""
# rehearsal player: start the next song 5 s after the end of a song
# (off: wait for Play; the Rehearsal and Mixer tabs write this)
# rehearsal_autoplay = "false"
# stereo MP3 backup (tab "Export Stereo-MP3"): target folder, file name pattern
# ({nr}, {song}, {playlist}); the left/right mixers are written as backup.left.* / backup.right.*
# backup_dir = "D:\Backup-MP3"
# backup_pattern = "{nr} {song}"
